syntax = "proto3";

package google_autocomplete;

message SentenceRecord {
  uint32 sentence_id = 1;
  string original_sentence = 2;
  string normalized_sentence = 3;
  string source_path = 4;
  uint32 offset = 5;
  string casefolded_sentence = 6;
}

message CorpusChunk {
  uint32 format_version = 1;
  uint32 chunk_number = 2;
  repeated SentenceRecord sentences = 3;
}
